name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `rust-solitaire`
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `rust-solitaire --version`, or the commit hash.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and terminal emulator.
      placeholder: macOS 15, iTerm2
    validations:
      required: true
